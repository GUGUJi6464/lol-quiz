<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英雄聯盟測驗（待定）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />

  <!-- Firebase v8 compat（直接用 CDN，不需 npm） -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary:     #ffffff;
      --bg-secondary:   #f5f5f4;
      --bg-tertiary:    #fafaf9;
      --text-primary:   #1c1917;
      --text-secondary: #78716c;
      --text-tertiary:  #a8a29e;
      --border-light:   rgba(0,0,0,0.10);
      --border-mid:     rgba(0,0,0,0.20);
      --radius-md: 8px;
      --radius-lg: 12px;
      --green-bg: #ECFDF5; --green-text: #065F46; --green-border: #059669;
      --red-bg:   #FEF2F2; --red-text:   #991B1B; --red-border:   #DC2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary:     #1c1917;
        --bg-secondary:   #292524;
        --bg-tertiary:    #231f1e;
        --text-primary:   #fafaf9;
        --text-secondary: #a8a29e;
        --text-tertiary:  #78716c;
        --border-light:   rgba(255,255,255,0.10);
        --border-mid:     rgba(255,255,255,0.20);
        --green-bg: #052e16; --green-text: #86efac; --green-border: #059669;
        --red-bg:   #450a0a; --red-text:   #fca5a5; --red-border:   #DC2626;
      }
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem 1rem 5rem;
    }
    #app { max-width: 660px; margin: 0 auto; }
    .screen { display: none; }
    .screen.active { display: block; animation: fadein 0.2s ease; }
    @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }

    /* ── 共用 ── */
    .card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .btn-primary {
      width: 100%; padding: 13px;
      background: var(--text-primary); color: var(--bg-primary);
      border: none; border-radius: var(--radius-lg);
      font-size: 15px; font-weight: 500;
      font-family: 'Noto Sans TC', sans-serif;
      cursor: pointer; transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.82; }
    .btn-primary:disabled { opacity: 0.28; cursor: not-allowed; }
    .ghost-btn {
      width: 100%; margin-top: 0.75rem; padding: 11px;
      border: 0.5px solid var(--border-light); border-radius: var(--radius-md);
      background: transparent; color: var(--text-secondary); font-size: 13px;
      font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: background 0.15s;
    }
    .ghost-btn:hover { background: var(--bg-secondary); }

    /* ── 畫面 1：輸入暱稱 ── */
    .name-wrap { max-width: 380px; margin: 0 auto; padding-top: 1rem; text-align: center; }
    .lol-logo { font-family:'Playfair Display',serif; font-size:36px; margin-bottom:0.3rem; line-height:1.2; }
    .lol-sub  { font-size:13px; color:var(--text-secondary); margin-bottom:1.75rem; }
    .firebase-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; padding: 4px 14px; border-radius: 50px;
      background: var(--bg-secondary); color: var(--text-secondary);
      border: 0.5px solid var(--border-light); margin-bottom: 2rem;
    }
    .firebase-badge .dot { width:6px; height:6px; border-radius:50%; background:#059669; }
    .name-label { font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px; text-align:left; }
    .name-input {
      width:100%; font-size:15px; padding:11px 14px;
      border:0.5px solid var(--border-light); border-radius:var(--radius-md);
      background:var(--bg-primary); color:var(--text-primary);
      font-family:'Noto Sans TC',sans-serif; outline:none;
      transition:border-color 0.15s; margin-bottom:1rem; display:block;
    }
    .name-input:focus { border-color: var(--border-mid); }

    /* ── 畫面 2：測驗 ── */
    .quiz-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; }
    .quiz-title-sm { font-size:14px; font-weight:500; max-width:60%; }
    .timer-badge {
      font-size:14px; font-weight:500;
      background:var(--bg-secondary); padding:5px 16px; border-radius:50px;
      border:0.5px solid var(--border-light);
      min-width:64px; text-align:center;
      transition:background 0.3s, color 0.3s;
      font-variant-numeric: tabular-nums;
    }
    .timer-badge.warn   { background:#FEF9C3; color:#854D0E; border-color:#FDE047; }
    .timer-badge.danger { background:var(--red-bg); color:var(--red-text); border-color:var(--red-border); }

    .progress-wrap { margin-bottom:1.25rem; }
    .progress-bar  { height:5px; background:var(--border-light); border-radius:3px; overflow:hidden; }
    .progress-fill { height:100%; background:var(--text-primary); border-radius:3px; transition:width 0.4s ease; }
    .prog-label    { font-size:12px; color:var(--text-secondary); margin-top:5px; }

    .question-text { font-size:17px; font-weight:500; line-height:1.65; margin-bottom:1.25rem; }
    .options-grid  { display:flex; flex-direction:column; gap:9px; }
    .opt-btn {
      padding:12px 16px; border:0.5px solid var(--border-light);
      border-radius:10px; background:var(--bg-secondary);
      color:var(--text-primary); font-size:14px;
      font-family:'Noto Sans TC',sans-serif;
      cursor:pointer; text-align:left;
      transition:border-color 0.15s, background 0.15s;
      display:flex; align-items:center; gap:12px;
    }
    .opt-btn:hover:not(:disabled) { border-color:var(--border-mid); background:var(--bg-primary); }
    .opt-btn.correct { border-color:var(--green-border)!important; background:var(--green-bg)!important; color:var(--green-text)!important; }
    .opt-btn.wrong   { border-color:var(--red-border)!important;   background:var(--red-bg)!important;   color:var(--red-text)!important; }
    .opt-btn:disabled { cursor:default; }
    .opt-circle {
      width:26px; height:26px; border-radius:50%;
      border:1.5px solid currentColor;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:500; flex-shrink:0; opacity:0.6;
    }
    .feedback-bar { padding:11px 16px; border-radius:10px; font-size:14px; font-weight:500; margin:1rem 0; display:none; }
    .feedback-bar.show { display:block; }
    .feedback-bar.ok { background:var(--green-bg); color:var(--green-text); }
    .feedback-bar.no { background:var(--red-bg);   color:var(--red-text); }
    .next-btn {
      width:100%; padding:12px;
      border:0.5px solid var(--border-mid); border-radius:10px;
      background:transparent; color:var(--text-primary); font-size:14px;
      font-family:'Noto Sans TC',sans-serif;
      cursor:pointer; display:none; transition:background 0.15s;
    }
    .next-btn.show  { display:block; }
    .next-btn:hover { background:var(--bg-secondary); }

    /* ── 畫面 3：結果 ── */
    .result-wrap { text-align:center; padding:0.5rem 0; }
    .rank-badge {
      margin:0 auto 1.25rem; width:118px; height:118px; border-radius:50%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      border:3px solid currentColor;
    }
    .rank-icon { font-size:42px; line-height:1; }
    .rank-lbl  { font-size:12px; font-weight:500; margin-top:4px; letter-spacing:0.06em; }
    .score-big { font-family:'Playfair Display',serif; font-size:68px; font-weight:700; line-height:1; margin-bottom:0.2rem; }
    .score-sub     { font-size:13px; color:var(--text-secondary); margin-bottom:0.4rem; }
    .correct-count { font-size:15px; margin-bottom:0.25rem; }
    .correct-count span { font-weight:700; }
    .time-taken    { font-size:13px; color:var(--text-secondary); margin-bottom:1.5rem; }

    /* Firebase 儲存狀態指示器 */
    .db-status {
      display:inline-flex; align-items:center; gap:7px;
      font-size:12px; padding:5px 14px; border-radius:50px;
      background:var(--bg-secondary); color:var(--text-secondary);
      border:0.5px solid var(--border-light); margin-bottom:1.25rem;
    }
    .db-status .dot { width:7px; height:7px; border-radius:50%; background:#a8a29e; transition:background 0.4s; }
    .db-status.saving .dot { background:#F59E0B; }
    .db-status.saved  .dot { background:#059669; }
    .db-status.err    .dot { background:#DC2626; }

    .rank-scale { display:flex; gap:4px; justify-content:center; margin:0 auto 1.5rem; max-width:480px; }
    .rank-pip { height:6px; border-radius:3px; flex:1; opacity:0.2; transition:opacity 0.4s, transform 0.4s; }
    .rank-pip.active { opacity:1; transform:scaleY(1.8); }

    .share-section { margin-top:1.5rem; }
    .share-section h3 { font-size:13px; color:var(--text-secondary); margin-bottom:0.9rem; }
    .share-btns { display:flex; gap:9px; justify-content:center; flex-wrap:wrap; }
    .share-btn {
      padding:10px 20px; border-radius:50px; border:none;
      font-size:13px; font-weight:500;
      font-family:'Noto Sans TC',sans-serif;
      cursor:pointer; display:inline-flex; align-items:center; gap:7px;
      transition:opacity 0.15s;
    }
    .share-btn:hover { opacity:0.82; }
    .share-ig   { background:linear-gradient(135deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888); color:#fff; }
    .share-th   { background:#000; color:#fff; }
    .share-copy { background:var(--bg-secondary); color:var(--text-primary); border:0.5px solid var(--border-mid)!important; }

    .retry-btn {
      margin-top:1rem; padding:10px 24px; border-radius:50px;
      border:0.5px solid var(--border-mid); background:transparent;
      color:var(--text-primary); font-size:14px;
      font-family:'Noto Sans TC',sans-serif;
      cursor:pointer; transition:background 0.15s;
    }
    .retry-btn:hover { background:var(--bg-secondary); }

    .detail-toggle {
      margin-top:1.5rem; font-size:13px; color:var(--text-secondary);
      cursor:pointer; text-decoration:underline; text-underline-offset:3px; display:inline-block;
    }
    .detail-list { margin-top:1rem; text-align:left; display:none; }
    .detail-list.show { display:block; }
    .detail-item { padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:6px; display:flex; align-items:flex-start; gap:10px; }
    .detail-item.ok { background:var(--green-bg); color:var(--green-text); }
    .detail-item.no { background:var(--red-bg);   color:var(--red-text); }
    .d-icon { flex-shrink:0; font-weight:700; }
    .d-q    { flex:1; }
    .d-ans  { font-size:12px; margin-top:3px; opacity:0.72; }

    /* ── 畫面 4：排行榜 ── */
    .lb-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; }
    .lb-header h2 { font-size:18px; font-weight:500; }
    .back-btn {
      padding:7px 18px; border:0.5px solid var(--border-mid); border-radius:50px;
      background:transparent; color:var(--text-secondary); font-size:13px;
      font-family:'Noto Sans TC',sans-serif; cursor:pointer; transition:background 0.15s;
    }
    .back-btn:hover { background:var(--bg-secondary); }
    #lb-content.lb-loading { text-align:center; padding:2rem; color:var(--text-secondary); font-size:14px; }
    .lb-empty { text-align:center; padding:2rem; color:var(--text-secondary); font-size:14px; line-height:1.7; }
    .lb-table { width:100%; border-collapse:collapse; font-size:14px; }
    .lb-table th {
      font-size:12px; font-weight:500; color:var(--text-secondary);
      padding:8px 10px; text-align:left;
      border-bottom:0.5px solid var(--border-light);
    }
    .lb-table td { padding:10px 10px; border-bottom:0.5px solid var(--border-light); vertical-align:middle; }
    .lb-table tr:last-child td { border-bottom:none; }
    .lb-table tr:hover td { background:var(--bg-secondary); }
    .lb-rank-num { font-size:13px; color:var(--text-tertiary); font-weight:500; }
    .lb-name-main { font-weight:500; font-size:14px; }
    .lb-name-date { font-size:11px; color:var(--text-tertiary); margin-top:1px; }
    .lb-score-val { font-size:16px; font-weight:700; }
    .lb-meta      { font-size:12px; color:var(--text-secondary); }
    code { font-size:12px; background:var(--bg-secondary); padding:2px 6px; border-radius:4px; }
  </style>
</head>
<body>
<div id="app">

  <!-- ══ 畫面 1：輸入暱稱 ══ -->
  <div id="screen-name" class="screen active">
    <div class="name-wrap">
      <div class="lol-logo">英雄聯盟測驗<br><span style="font-size:18px;color:var(--text-secondary)">（待定）</span></div>
      <div class="lol-sub">十道題目，考驗你的英雄聯盟知識！</div>
      <div class="firebase-badge"><span class="dot"></span> Firebase 資料庫已連線</div>

      <label class="name-label" for="player-name">你的暱稱（將顯示在排行榜）</label>
      <input class="name-input" id="player-name" type="text" placeholder="輸入你的名稱..." maxlength="20" />

      <button class="btn-primary" id="btn-enter" disabled>開始挑戰 →</button>
      <button class="ghost-btn" id="btn-view-lb">🏆 查看排行榜</button>
    </div>
  </div>

  <!-- ══ 畫面 2：測驗 ══ -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-top">
      <span class="quiz-title-sm" id="quiz-title-display"></span>
      <span class="timer-badge" id="timer-badge">0:00</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="prog-label" id="prog-label"></div>
    </div>
    <div class="card" style="margin-bottom:1rem;">
      <div class="question-text" id="question-text"></div>
      <div class="options-grid" id="options-grid"></div>
    </div>
    <div class="feedback-bar" id="feedback-bar"></div>
    <button class="next-btn" id="next-btn">下一題 →</button>
  </div>

  <!-- ══ 畫面 3：結果 ══ -->
  <div id="screen-result" class="screen">
    <div class="result-wrap">
      <div class="rank-badge" id="rank-badge">
        <div class="rank-icon" id="rank-icon"></div>
        <div class="rank-lbl"  id="rank-name"></div>
      </div>
      <div class="score-big" id="score-big"></div>
      <div class="score-sub">總分</div>
      <div class="correct-count" id="correct-count"></div>
      <div class="time-taken"    id="time-taken"></div>

      <div class="db-status" id="db-status">
        <span class="dot"></span>
        <span id="db-status-text">準備儲存...</span>
      </div>

      <div class="rank-scale" id="rank-scale"></div>

      <div class="share-section">
        <h3>分享你的成績</h3>
        <div class="share-btns">
          <button class="share-btn share-ig"   id="btn-ig">📸 Instagram</button>
          <button class="share-btn share-th"   id="btn-th">🧵 Threads</button>
          <button class="share-btn share-copy" id="btn-copy">🔗 複製連結</button>
        </div>
      </div>

      <div style="margin-top:1rem;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;">
        <button class="retry-btn" id="btn-result-lb">🏆 查看排行榜</button>
        <button class="retry-btn" id="btn-retry">↺ 重新挑戰</button>
      </div>

      <div class="detail-toggle" id="detail-toggle">查看詳細解答</div>
      <div class="detail-list"   id="detail-list"></div>
    </div>
  </div>

  <!-- ══ 畫面 4：排行榜 ══ -->
  <div id="screen-leaderboard" class="screen">
    <div class="lb-header">
      <h2>🏆 排行榜</h2>
      <button class="back-btn" id="btn-back">← 返回</button>
    </div>
    <div class="card" style="padding:1rem;">
      <div id="lb-content" class="lb-loading">載入中...</div>
    </div>
  </div>

</div>

<script>

const QUIZ = {

    {
      q: '英雄「辛吉德」（Singed）最廣為人知的跑法策略是什麼？',
      opts: { A:'躲在草叢偷攻', B:'讓敵人追著跑吃毒液傷害', C:'塔下磨血', D:'頻繁傳送支援' },
      correct: 'B'
    }
  ]
};

/* ════════════════════════════════════════════════
   全域狀態
════════════════════════════════════════════════ */
let playerName  = '';
let current     = 0;
let score       = 0;
let answers     = [];
let answered    = false;
let startTime   = 0;
let elapsedSec  = 0;
let timerHandle = null;
let prevScreen  = 'screen-name';

/* ════════════════════════════════════════════════
   工具函式
════════════════════════════════════════════════ */
function getRank(s)  { return RANKS.find(r => s >= r.min && s <= r.max) || RANKS[0]; }
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function fmtTime(sec) {
  return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
}
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setDbStatus(state, text) {
  document.getElementById('db-status').className = 'db-status ' + state;
  document.getElementById('db-status-text').textContent = text;
}

/* ════════════════════════════════════════════════
   計時器
════════════════════════════════════════════════ */
function startTimer() {
  startTime = Date.now();
  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    const sec   = Math.floor((Date.now() - startTime) / 1000);
    const badge = document.getElementById('timer-badge');
    badge.textContent = fmtTime(sec);
    badge.className   = 'timer-badge' + (sec >= 120 ? ' danger' : sec >= 90 ? ' warn' : '');
  }, 500);
}
function stopTimer() {
  clearInterval(timerHandle);
  elapsedSec = Math.floor((Date.now() - startTime) / 1000);
}

/* ════════════════════════════════════════════════
   測驗邏輯
════════════════════════════════════════════════ */
function startQuiz() {
  current  = 0; score = 0; answers = []; answered = false;
  showScreen('screen-quiz');
  document.getElementById('quiz-title-display').textContent = QUIZ.title;
  startTimer();
  renderQuestion();
}

function renderQuestion() {
  const q     = QUIZ.questions[current];
  const total = QUIZ.questions.length;
  document.getElementById('progress-fill').style.width = `${(current/total)*100}%`;
  document.getElementById('prog-label').textContent    = `第 ${current+1} 題 / 共 ${total} 題`;
  document.getElementById('question-text').textContent = q.q;

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  Object.entries(q.opts).forEach(([letter, text]) => {
    const btn = document.createElement('button');
    btn.className      = 'opt-btn';
    btn.dataset.letter = letter;
    btn.innerHTML      = `<span class="opt-circle">${letter}</span>${escHtml(text)}`;
    btn.onclick        = () => selectAnswer(letter);
    grid.appendChild(btn);
  });
  document.getElementById('feedback-bar').className = 'feedback-bar';
  document.getElementById('next-btn').className     = 'next-btn';
  answered = false;
}

function selectAnswer(letter) {
  if (answered) return;
  answered = true;
  const q         = QUIZ.questions[current];
  const isCorrect = letter === q.correct;
  if (isCorrect) score += 10;

  answers.push({
    questionText: q.q,
    selected:     letter,
    selectedText: q.opts[letter] || '',
    correct:      q.correct,
    correctText:  q.opts[q.correct] || '',
    isCorrect
  });

  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.letter === q.correct)            btn.classList.add('correct');
    if (btn.dataset.letter === letter && !isCorrect) btn.classList.add('wrong');
  });

  const fb = document.getElementById('feedback-bar');
  fb.textContent = isCorrect
    ? '✓ 答對了！'
    : `✗ 答錯了，正確答案是 ${q.correct}：${q.opts[q.correct]}`;
  fb.className = 'feedback-bar show ' + (isCorrect ? 'ok' : 'no');

  const nb = document.getElementById('next-btn');
  nb.textContent = current < QUIZ.questions.length-1 ? '下一題 →' : '查看結果 →';
  nb.className   = 'next-btn show';
}

document.getElementById('next-btn').addEventListener('click', () => {
  current++;
  if (current < QUIZ.questions.length) { renderQuestion(); }
  else { stopTimer(); showResult(); }
});

/* ════════════════════════════════════════════════
   結果 + 寫入 Firestore
════════════════════════════════════════════════ */
async function showResult() {
  showScreen('screen-result');
  const rank    = getRank(score);
  const correct = answers.filter(a => a.isCorrect).length;

  const badge = document.getElementById('rank-badge');
  badge.style.color = badge.style.borderColor = rank.color;
  document.getElementById('rank-icon').textContent = rank.icon;
  document.getElementById('rank-name').textContent = rank.name;
  document.getElementById('score-big').textContent = score;
  document.getElementById('score-big').style.color = rank.color;
  document.getElementById('correct-count').innerHTML = `答對 <span>${correct}</span> 題 / 共 ${answers.length} 題`;
  document.getElementById('time-taken').textContent  = `⏱ 作答時間：${fmtTime(elapsedSec)}`;

  document.getElementById('rank-scale').innerHTML = RANKS.map(r =>
    `<div class="rank-pip${score>=r.min?' active':''}" style="background:${r.color}" title="${r.name}"></div>`
  ).join('');

  /* ── 寫入 Firestore ── */
  setDbStatus('saving', '正在儲存成績...');
  try {
    await db.collection(COLLECTION).add({
      playerName,                           /* 玩家暱稱 */
      score,                                /* 分數 */
      rankName:       rank.name,            /* 段位名稱 */
      rankIcon:       rank.icon,            /* 段位圖示 */
      correctCount:   correct,              /* 答對題數 */
      totalQuestions: answers.length,       /* 總題數 */
      timeTakenSec:   elapsedSec,           /* 作答秒數 */
      quizTitle:      QUIZ.title,           /* 測驗名稱（用於篩選排行榜） */
      answerDetail:   answers.map((a,i) => ({  /* 每題對錯明細 */
        no:         i+1,
        question:   a.questionText,
        selected:   a.selected,
        yourAnswer: a.selectedText,
        correct:    a.correct,
        answer:     a.correctText,
        isCorrect:  a.isCorrect
      })),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()  /* 伺服器時間 */
    });
    setDbStatus('saved', '✓ 成績已儲存至 Firebase');
  } catch (err) {
    console.error('Firestore 寫入失敗：', err);
    setDbStatus('err', '⚠ 儲存失敗（請檢查 Firebase 規則或網路）');
  }

  /* 分享 */
  const shareText =
    `我在《${QUIZ.title}》獲得了 ${rank.icon} ${rank.name}！\n` +
    `得了 ${score} 分，作答時間 ${fmtTime(elapsedSec)}，你也來挑戰！\n${location.href}`;
  const shareEnc = encodeURIComponent(shareText);

  document.getElementById('btn-ig').onclick = () => {
    navigator.clipboard?.writeText(shareText);
    window.open('https://www.instagram.com/', '_blank');
    alert('成績文字已複製！請在 Instagram 貼上 📸');
  };
  document.getElementById('btn-th').onclick = () =>
    window.open(`https://www.threads.net/intent/post?text=${shareEnc}`, '_blank');
  document.getElementById('btn-copy').onclick = () =>
    navigator.clipboard?.writeText(shareText).then(() => {
      document.getElementById('btn-copy').textContent = '✓ 已複製！';
      setTimeout(() => { document.getElementById('btn-copy').textContent = '🔗 複製連結'; }, 2000);
    });

  /* 詳細解答 */
  document.getElementById('detail-list').innerHTML = answers.map((a,i) => `
    <div class="detail-item ${a.isCorrect?'ok':'no'}">
      <span class="d-icon">${a.isCorrect?'✓':'✗'}</span>
      <div class="d-q">
        <div>Q${i+1}. ${escHtml(a.questionText)}</div>
        ${!a.isCorrect
          ? `<div class="d-ans">你的答案：${a.selected} ${escHtml(a.selectedText)}　正確：${a.correct} ${escHtml(a.correctText)}</div>`
          : ''}
      </div>
    </div>`).join('');
}

/* ════════════════════════════════════════════════
   排行榜：從 Firestore 讀取
   依 score 降冪 → timeTakenSec 升冪
   ※ 若排序報錯，請至 Firebase Console 建立複合索引
════════════════════════════════════════════════ */
async function loadLeaderboard() {
  const content = document.getElementById('lb-content');
  content.className = 'lb-loading';
  content.textContent = '載入中...';
  try {
    const snap = await db.collection(COLLECTION)
      .where('quizTitle', '==', QUIZ.title)
      .orderBy('score', 'desc')
      .orderBy('timeTakenSec', 'asc')
      .limit(20)
      .get();

    if (snap.empty) {
      content.className = '';
      content.innerHTML = '<div class="lb-empty">還沒有人完成測驗，成為第一名吧！🎉</div>';
      return;
    }

    const medals = ['🥇','🥈','🥉'];
    const rows = snap.docs.map((doc,i) => {
      const d    = doc.data();
      const rank = getRank(d.score||0);
      const date = d.createdAt
        ? new Date(d.createdAt.toMillis()).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})
        : '—';
      const rankLabel = i < 3
        ? `<span style="font-size:18px">${medals[i]}</span>`
        : `<span class="lb-rank-num">#${i+1}</span>`;
      return `<tr>
        <td style="width:40px">${rankLabel}</td>
        <td>
          <div class="lb-name-main">${escHtml(d.playerName||'匿名')}</div>
          <div class="lb-name-date">${date}</div>
        </td>
        <td style="font-size:18px">${rank.icon}</td>
        <td>
          <span class="lb-score-val" style="color:${rank.color}">${d.score}</span>
          <span class="lb-meta"> 分</span>
        </td>
        <td class="lb-meta">${fmtTime(d.timeTakenSec||0)}</td>
        <td class="lb-meta">${d.correctCount??'—'}/${d.totalQuestions??10} 題</td>
      </tr>`;
    }).join('');

    content.className = '';
    content.innerHTML = `
      <table class="lb-table">
        <thead>
          <tr><th>名次</th><th>玩家</th><th>段位</th><th>分數</th><th>時間</th><th>答對</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch (err) {
    console.error('排行榜讀取失敗：', err);
    content.className = '';
    content.innerHTML =
      '<div class="lb-empty">⚠ 載入失敗。<br><br>' +
      '請至 Firebase Console → Firestore → 索引，新增複合索引：<br>' +
      '<code>quizTitle ASC + score DESC + timeTakenSec ASC</code></div>';
  }
}

/* ════════════════════════════════════════════════
   事件綁定
════════════════════════════════════════════════ */
const nameInput = document.getElementById('player-name');
const btnEnter  = document.getElementById('btn-enter');

nameInput.addEventListener('input', () => {
  btnEnter.disabled = nameInput.value.trim().length === 0;
});
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !btnEnter.disabled) btnEnter.click();
});
btnEnter.addEventListener('click', () => {
  playerName = nameInput.value.trim();
  startQuiz();
});

document.getElementById('btn-view-lb').addEventListener('click', () => {
  prevScreen = 'screen-name';
  showScreen('screen-leaderboard');
  loadLeaderboard();
});
document.getElementById('btn-result-lb').addEventListener('click', () => {
  prevScreen = 'screen-result';
  showScreen('screen-leaderboard');
  loadLeaderboard();
});
document.getElementById('btn-back').addEventListener('click', () => showScreen(prevScreen));

document.getElementById('detail-toggle').addEventListener('click', () => {
  const dl = document.getElementById('detail-list');
  dl.classList.toggle('show');
  document.getElementById('detail-toggle').textContent =
    dl.classList.contains('show') ? '收起解答' : '查看詳細解答';
});

document.getElementById('btn-retry').addEventListener('click', () => showScreen('screen-name'));
</script>
