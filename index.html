    {q:'Which of the following League of Legends items has the highest gold cost?',opts:{A:"Overlord's Bloodmail",B:'The Bloodthirster',C:'Trinity Force',D:'Shadowflame'},correct:'B'},
    {q:'As a regional esports league in the Asia-Pacific region, the LCP (League of Legends Championship Pacific) was initially formed through a major consolidation and upgrade of PCS, VCS (Vietnam), and which other region?',opts:{A:'LJL (Japan)',B:'LLA (Latin America)',C:'CBLOL (Brazil)',D:'LCK (Korea)'},correct:'A'},
    {q:'Which of the following players has competed in all three leagues: LMS, PCS, and LCP?',opts:{A:'SofM',B:'Momo',C:'REST',D:'Woody'},correct:'C'},
    {q:'Who is currently the oldest active pro player in the LCP region?',opts:{A:'Feng',B:'Kiaya',C:'Hizto',D:'Evi'},correct:'D'},
    {q:'Which teams in history have achieved an undefeated record in a single season within the LCP?',opts:{A:'CFO & PSG',B:'FW & AHQ',C:'TSW & SHG',D:'CFO & TSW'},correct:'D'},
    {q:'Among active LCP junglers, who achieved the highest First Blood Participation Rate in Season 16?',opts:{A:'Gury',B:'Husha',C:'Cirtus',D:'Van1'},correct:'B'},
    {q:'Which of the following individuals has NEVER served as a head coach or coach for an LCP team?',opts:{A:'WarHorse',B:'BigKoro',C:'Darktharr',D:'Paz'},correct:'C'},
    {q:'Since the inception of the LCP, who scored the very first First Blood in an official match, and against which player?',opts:{A:'CFO Doggo killed MVK SiuLoong',B:'GAM Kiaya killed SHG Marble',C:'TSW Eddie killed DFM Kakkun',D:'TLN Karsa killed CHF JimieN'},correct:'A'},
    {q:'"LCP" is the official abbreviation for which of the following full titles?',opts:{A:'League of Legends Competitive Pacific',B:'League of Legends Champions Pacific',C:'League of Legends Asia-Pacific',D:'League of Legends Championship Pacific'},correct:'D'}
  ]
};

const QUIZ_TITLE={zh:'LCP Ranked Fan Quiz: The Ultimate Lore Challenge',en:'LCP Ranked Fan Quiz: The Ultimate Lore Challenge'};
let lang='zh',playerName='',current=0,score=0,answers=[],answered=false,startTime=0,elapsedSec=0,timerHandle=null,prevScreen='screen-name',detailOpen=false;
const $=id=>document.getElementById(id);function T(){return STRINGS[lang]}
function getRankObj(s){const idx=RANK_BASE.findIndex(r=>s>=r.min&&s<=r.max);const i=idx>=0?idx:0;return {...RANK_BASE[i],name:T().rankNames[i]}}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function fmtTime(sec){return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function escHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function setDbStatus(state,text){$('db-status').className='db-status '+state;$('db-status-text').textContent=text}

function applyLang(){const t=T();document.documentElement.lang=lang==='zh'?'zh-TW':'en';document.body.classList.toggle('lang-en',lang==='en');$('lang-flag').textContent=t.langFlag;$('lang-label').textContent=t.langLabel;$('ui-logo').innerHTML=t.logo;$('ui-sub').textContent=t.sub;$('ui-db-badge').textContent=t.dbBadge;$('ui-name-label').textContent=t.nameLabel;$('player-name').placeholder=t.namePlaceholder;$('btn-enter').textContent=t.btnEnter;$('btn-view-lb').textContent=t.btnLb;$('ui-score-sub').textContent=t.scoreSub;$('ui-share-title').textContent=t.shareTitle;$('btn-copy').textContent=t.btnCopy;$('btn-result-lb').textContent=t.btnResultLb;$('btn-retry').textContent=t.btnRetry;$('detail-toggle').textContent=detailOpen?t.detailHide:t.detailShow;$('ui-lb-title').textContent=t.lbTitle;$('btn-back').textContent=t.btnBack}
$('btn-lang').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';applyLang()});
function startTimer(){startTime=Date.now();clearInterval(timerHandle);timerHandle=setInterval(()=>{const sec=Math.floor((Date.now()-startTime)/1000),b=$('timer-badge');b.textContent=fmtTime(sec);b.className='timer-badge'+(sec>=120?' danger':sec>=90?' warn':'')},500)}
function stopTimer(){clearInterval(timerHandle);elapsedSec=Math.floor((Date.now()-startTime)/1000)}
function startQuiz(){current=0;score=0;answers=[];answered=false;detailOpen=false;showScreen('screen-quiz');$('quiz-title-display').textContent=QUIZ_TITLE[lang];startTimer();renderQuestion()}
function renderQuestion(){const t=T(),q=QUESTIONS[lang][current],total=QUESTIONS[lang].length;$('progress-fill').style.width=`${(current/total)*100}%`;$('prog-label').textContent=t.progLabel(current+1,total);$('question-text').textContent=q.q;$('options-grid').innerHTML='';Object.entries(q.opts).forEach(([letter,text])=>{const btn=document.createElement('button');btn.className='opt-btn';btn.dataset.letter=letter;btn.innerHTML=`<span class="opt-circle">${letter}</span><span>${escHtml(text)}</span>`;btn.onclick=()=>selectAnswer(letter);$('options-grid').appendChild(btn)});$('feedback-bar').className='feedback-bar';$('next-btn').className='next-btn';$('next-btn').textContent='';answered=false}
function selectAnswer(letter){if(answered)return;answered=true;const t=T(),q=QUESTIONS[lang][current],ok=letter===q.correct;if(ok)score+=10;answers.push({questionText:q.q,selected:letter,selectedText:q.opts[letter]||'',correct:q.correct,correctText:q.opts[q.correct]||'',isCorrect:ok});document.querySelectorAll('.opt-btn').forEach(btn=>{btn.disabled=true;if(btn.dataset.letter===q.correct)btn.classList.add('correct');if(btn.dataset.letter===letter&&!ok)btn.classList.add('wrong')});const fb=$('feedback-bar');fb.textContent=ok?t.feedbackOk:t.feedbackNo(q.correct,q.opts[q.correct]);fb.className='feedback-bar show '+(ok?'ok':'no');const nb=$('next-btn');nb.textContent=current<QUESTIONS[lang].length-1?t.nextBtn:t.finishBtn;nb.className='next-btn show'}
$('next-btn').addEventListener('click',()=>{current++;if(current<QUESTIONS[lang].length)renderQuestion();else{stopTimer();showResult()}});

async function showResult(){showScreen('screen-result');const t=T(),rank=getRankObj(score),correct=answers.filter(a=>a.isCorrect).length;const badge=$('rank-badge');badge.style.color=badge.style.borderColor=rank.color;$('rank-icon').textContent=rank.icon;$('rank-name').textContent=rank.name;$('score-big').textContent=score;$('score-big').style.color=rank.color;$('correct-count').innerHTML=t.correctCount(correct,answers.length);$('time-taken').textContent=t.timeTaken(fmtTime(elapsedSec));$('ui-score-sub').textContent=t.scoreSub;$('ui-share-title').textContent=t.shareTitle;$('btn-copy').textContent=t.btnCopy;$('btn-result-lb').textContent=t.btnResultLb;$('btn-retry').textContent=t.btnRetry;$('detail-toggle').textContent=t.detailShow;$('rank-scale').innerHTML=RANK_BASE.map((r,i)=>`<div class="rank-pip${score>=r.min?' active':''}" style="background:${r.color}" title="${T().rankNames[i]}"></div>`).join('');setDbStatus('saving',t.dbSaving);
  try{await db.collection(COLLECTION).add({playerName,score,rankName:rank.name,rankIcon:rank.icon,correctCount:correct,totalQuestions:answers.length,timeTakenSec:elapsedSec,quizTitle:QUIZ_TITLE[lang],lang,answerDetail:answers.map((a,i)=>({no:i+1,question:a.questionText,selected:a.selected,yourAnswer:a.selectedText,correct:a.correct,answer:a.correctText,isCorrect:a.isCorrect})),createdAt:firebase.firestore.FieldValue.serverTimestamp()});setDbStatus('saved',t.dbSaved)}catch(err){console.error('Firestore write failed:',err);setDbStatus('err',t.dbErr)}
  const shareText=T().shareText(QUIZ_TITLE[lang],rank.icon,rank.name,score,fmtTime(elapsedSec)),shareEnc=encodeURIComponent(shareText);
  function copyText(text){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text);const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);return Promise.resolve()}
  $('btn-ig').onclick=()=>copyText(shareText).then(()=>{window.open('https://www.instagram.com/','_blank');alert(lang==='zh'?'✅ 成績文字已複製到剪貼簿！\n請在 Instagram 開新貼文後貼上 📸':'✅ Score copied to clipboard!\nOpen Instagram and paste into a new post 📸')});
  $('btn-th').onclick=()=>window.open(`https://www.threads.net/intent/post?text=${shareEnc}`,'_blank');
  $('btn-copy').onclick=()=>copyText(shareText).then(()=>{$('btn-copy').textContent=T().btnCopied;setTimeout(()=>$('btn-copy').textContent=T().btnCopy,2000)});
  $('detail-list').innerHTML=answers.map((a,i)=>`<div class="detail-item ${a.isCorrect?'ok':'no'}"><span class="d-icon">${a.isCorrect?'✓':'✗'}</span><div class="d-q"><div>Q${i+1}. ${escHtml(a.questionText)}</div>${!a.isCorrect?`<div class="d-ans">${escHtml(T().detailAns(a.selected,a.selectedText,a.correct,a.correctText))}</div>`:''}</div></div>`).join('')}

async function loadLeaderboard(){const content=$('lb-content'),t=T();content.className='lb-loading';content.textContent=t.lbLoading;try{const snap=await db.collection(COLLECTION).where('quizTitle','==',QUIZ_TITLE[lang]).orderBy('score','desc').orderBy('timeTakenSec','asc').limit(20).get();if(snap.empty){content.className='';content.innerHTML=`<div class="lb-empty">${t.lbEmpty}</div>`;return}const medals=['🥇','🥈','🥉'];const rows=snap.docs.map((doc,i)=>{const d=doc.data(),rank=getRankObj(d.score||0),date=d.createdAt?new Date(d.createdAt.toMillis()).toLocaleDateString(t.dateLocale,{month:'short',day:'numeric'}):'—',lbl=i<3?`<span style="font-size:18px">${medals[i]}</span>`:`<span class="lb-rank-num">#${i+1}</span>`;return `<tr><td style="width:40px">${lbl}</td><td><div class="lb-name-main">${escHtml(d.playerName||t.lbAnon)}</div><div class="lb-name-date">${date}</div></td><td style="font-size:18px">${rank.icon}</td><td><span class="lb-score-val" style="color:${rank.color}">${d.score}</span><span class="lb-meta">${t.lbPts}</span></td><td class="lb-meta">${fmtTime(d.timeTakenSec||0)}</td><td class="lb-meta">${t.lbQCount(d.correctCount??'—',d.totalQuestions??10)}</td></tr>`}).join('');content.className='';content.innerHTML=`<table class="lb-table"><thead><tr>${t.lbCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`}catch(err){console.error('Leaderboard load failed:',err);content.className='';content.innerHTML=`<div class="lb-empty">${t.lbErr}</div>`}}

const nameInput=$('player-name'),btnEnter=$('btn-enter');nameInput.addEventListener('input',()=>{btnEnter.disabled=nameInput.value.trim().length===0});nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btnEnter.disabled)btnEnter.click()});btnEnter.addEventListener('click',()=>{playerName=nameInput.value.trim();startQuiz()});$('btn-view-lb').addEventListener('click',()=>{prevScreen='screen-name';showScreen('screen-leaderboard');loadLeaderboard()});$('btn-result-lb').addEventListener('click',()=>{prevScreen='screen-result';showScreen('screen-leaderboard');loadLeaderboard()});$('btn-back').addEventListener('click',()=>showScreen(prevScreen));$('detail-toggle').addEventListener('click',()=>{const dl=$('detail-list');dl.classList.toggle('show');detailOpen=dl.classList.contains('show');$('detail-toggle').textContent=detailOpen?T().detailHide:T().detailShow});$('btn-retry').addEventListener('click',()=>showScreen('screen-name'));
applyLang();
</script>
</body>
